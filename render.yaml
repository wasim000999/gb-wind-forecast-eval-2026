services:
  - type: web
    name: gb-wind-forecast-eval
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEFAULT_CUTOFF_STRATEGY
        value: D1_1100
